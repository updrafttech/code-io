<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — CODE.IO</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css"></head><body><header class="site-header scrolled"><div class="nav-inner"><a class="brand" href="index.html"><img class="brand-mark" src="assets/CODE.IO.png" alt=""><span>CODE<span class="brand-dot">.</span>IO</span></a><nav class="nav-links"><a href="work.html">Work</a><a href="index.html#approach">Approach</a><a href="team.html">Team</a><a href="index.html#contact">Contact</a></nav><div data-auth-slot></div></div></header><main class="profile-page"><section class="profile-card"><div class="profile-avatar" id="profile-avatar"></div><p class="eyebrow">YOUR ACCOUNT</p><h1 id="profile-name">Profile</h1><p id="profile-email"></p><div class="profile-section"><h2>Profile information</h2><label>Name<input id="name-input"></label><label>Email<input id="email-input" type="email"></label><button class="button" id="save-profile">Save Changes</button></div><div class="profile-section"><h2>Account</h2><p id="profile-role"></p><button class="button outline" id="admin-profile" hidden>Open Admin Panel</button><button class="button outline" id="logout-profile">Logout</button></div><div class="profile-section"><h2>Preferences</h2><label class="pref"><input type="checkbox" checked> Portfolio updates</label></div></section></main><script src="auth.js"></script><script>const u=Auth.getCurrentUser();if(!u)location.replace('admin-login.html');else{updateAuthUI();let i=n=>document.getElementById(n);i('profile-name').textContent=u.name;i('profile-email').textContent=u.email;i('profile-role').textContent='Role: '+(u.role==='admin'?'Administrator':'User');i('profile-avatar').textContent=u.name.split(' ').map(x=>x[0]).join('');i('name-input').value=u.name;i('email-input').value=u.email;i('admin-profile').hidden=u.role!=='admin';i('admin-profile').onclick=()=>document.querySelector('[data-admin-verify]').click();i('save-profile').onclick=()=>{u.name=i('name-input').value;u.email=i('email-input').value;sessionStorage.setItem('codeio-current-user',JSON.stringify(u));localStorage.setItem('codeio-current-user',JSON.stringify(u));updateAuthUI()};i('logout-profile').onclick=()=>{Auth.logout();location.href='index.html'}}</script></body></html>
