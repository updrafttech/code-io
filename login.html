<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — CODE.IO</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/CODE.IO.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <div id="progress"></div>
    <div id="cursor"></div>
    <div class="site-grid" aria-hidden="true"></div>
    <div class="site-orb one" aria-hidden="true"></div>
    <div class="site-orb two" aria-hidden="true"></div>
    <div class="site-noise" aria-hidden="true"></div>

    <header class="site-header scrolled auth-header">
      <div class="nav-inner">
        <a class="brand" href="index.html" aria-label="CODE.IO home">
          <img class="brand-mark" src="CODE.IO.png" alt="" />
          <span>CODE<span class="brand-dot">.</span>IO</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="work.html">Work</a>
          <a href="team.html">Team</a>
          <a href="index.html#contact">Contact</a>
        </nav>
        <a class="nav-cta" href="index.html">Back to website</a>
      </div>
    </header>

    <main>
      <div class="auth-wrap">
        <div class="auth-card rv in">
          <div class="auth-panel" data-tilt>
            <div class="auth-kicker"><span>CODE.IO / ACCOUNT</span><span class="auth-kicker-line" aria-hidden="true"></span></div>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-sub">Sign in to your CODE.IO account.</p>
            <form id="loginForm">
              <div class="field">
                <label for="femail">Email</label>
                <input id="femail" type="email" placeholder="you@company.com" autocomplete="email" required />
              </div>
              <div class="field">
                <label for="fpass">Password</label>
                <input id="fpass" type="password" placeholder="••••••••" autocomplete="current-password" required />
              </div>
              <p class="form-err" id="authErr" role="alert" aria-live="polite"></p>
              <button class="btn primary block auth-submit" type="submit" data-mag id="authSubmit">Sign in</button>
            </form>
            <p class="hint">Don't have an account? <a href="/register.html">Register</a></p>
          </div>
        </div>
      </div>
    </main>

    <footer class="auth-footer">
      <div class="f-in">
        <a class="brand auth-footer-brand" href="index.html">CODE<span class="brand-dot">.</span>IO</a>
        <span>© 2026 · Built by Pratyush, Oggy, Shubham</span>
        <span class="f-links"><a href="https://wa.me/918737820680" target="_blank">WhatsApp</a><a href="#">GitHub</a><a href="#">LinkedIn</a></span>
      </div>
    </footer>

    <div id="toast"></div>
    <script src="auth-client.js"></script>
    <script src="untouch.js"></script>
    <script>
      const form = document.getElementById("loginForm");
      const submitBtn = document.getElementById("authSubmit");
      const error = document.getElementById("authErr");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitBtn.disabled = true;
        error.classList.remove("show");
        const email = document.getElementById("femail").value.trim();
        const password = document.getElementById("fpass").value;
        try {
          const result = await CodeIOAuth.login(email, password);
          if (!result.response.ok) {
            error.textContent = result.response.status === 400 || result.response.status === 401
              ? "Invalid credentials."
              : "Sign in is temporarily unavailable. Please try again.";
            error.classList.add("show");
            return;
          }
          location.href = result.user?.role === "admin" ? "admin.html" : "index.html";
        } catch {
          error.textContent = "Sign in is temporarily unavailable. Please try again.";
          error.classList.add("show");
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
